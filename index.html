<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Estoque · Beto Informática</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f5; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e3e7ee;
  --blue:#0a7cff; --blue-d:#0063d1; --blue-l:#e6f1ff; --dark:#0b0f16; --dark2:#161c27; --silver:#c7ced9;
  --ok:#0f9d58; --ok-l:#e7f6ee; --warn:#b26a00; --warn-l:#fff4e0; --bad:#d93025; --bad-l:#fdecea;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0}
h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
small{color:var(--muted)}
.hide{display:none!important}

/* topo */
.top{background:linear-gradient(90deg,var(--dark),var(--dark2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:10px;border-bottom:2px solid var(--blue)}
.brand{display:flex;align-items:center;gap:10px}
.brandimg{height:46px;width:auto;border-radius:8px;display:block}
.login .brandimg{height:auto;width:100%;max-width:340px;border-radius:10px}
.brandsub{color:var(--silver);font-size:12px;letter-spacing:.04em}
.login .brandsub{color:var(--muted)}
.brand b{display:block;letter-spacing:.08em;font-size:15px}
.brand small{color:var(--silver);font-size:12px}
.logo{width:38px;height:38px;border-radius:9px;background:radial-gradient(circle at 30% 30%,#3aa0ff,var(--blue-d));display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;box-shadow:0 0 14px rgba(10,124,255,.55)}
.user{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--silver)}
.tabs{display:flex;gap:4px;background:var(--dark2);padding:0 12px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;color:var(--silver);padding:12px 11px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:#fff;border-bottom-color:var(--blue)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* elementos */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#b9c2d0}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-danger{color:var(--bad);border-color:#f3c2be}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-sm{padding:5px 10px;font-size:13px}
.btn-dark{background:transparent;color:var(--silver);border-color:#344055}
.btn:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600;text-decoration:underline}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#374151}
input,select,textarea{border:1px solid #cfd6e1;border-radius:9px;padding:9px 11px;background:#fff;font-weight:400;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
input:disabled{background:#f3f5f8;color:#9aa3b0}
textarea{min-height:64px;resize:vertical}
.chk{flex-direction:row;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
.full{grid-column:1/-1}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filtros input:not([type=checkbox]){flex:2 1 220px}.filtros select{flex:1 1 160px;width:auto}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eef1f5;color:#4b5563}
.tag.blue{background:var(--blue-l);color:var(--blue-d)}
.tag.ok{background:var(--ok-l);color:var(--ok)}
.tag.warn{background:var(--warn-l);color:var(--warn)}
.tag.bad{background:var(--bad-l);color:var(--bad)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.alert{border-radius:9px;padding:9px 12px;font-size:14px;margin-top:6px;line-height:1.7}
.alert .chipbtn,.alert .link{margin-left:6px}
.alert.warn{background:var(--warn-l);color:#6b4000;border:1px solid #f3d7a6}
.alert.info{background:var(--blue-l);color:#0b4a94;border:1px solid #c5dcfb}
.alert.bad{background:var(--bad-l);color:#8f1d15;border:1px solid #f4c3be}
.alert.ok{background:var(--ok-l);color:#0b6b3d;border:1px solid #bfe6cf}

/* tabelas */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7f9fc}
.tbl .pn{font-weight:600}
.tbl .sub{font-size:12px;color:var(--muted)}
.tbl th.num{text-align:right}
.tbl tr.cancel td{opacity:.5;text-decoration:line-through}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-size:22px;display:block;margin-top:4px}
.kpi.admin{border-left:4px solid var(--blue)}

/* calculadora de preço */
.calc{background:#f7f9fc;border:1px solid var(--line);border-radius:var(--r);padding:4px 14px 14px;margin:14px 0}
.custo-final{margin-top:12px;padding:10px 12px;background:#fff;border:1px dashed #b9c2d0;border-radius:9px}
.custo-final b{font-size:20px;color:var(--blue-d)}
.precos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preco-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preco-box .lbl{grid-column:1/-1;font-weight:800;letter-spacing:.04em}
.preco-box .lucro{grid-column:1/-1;font-size:13px;color:var(--ok)}
.pricegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pricecell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.pricecell small{display:block;text-transform:uppercase;font-size:11px;letter-spacing:.05em}
.pricecell b{font-size:19px}
.pricecell.hl{border-color:var(--blue);background:var(--blue-l)}

/* busca de produto/cliente */
.picker{position:relative}
.picker .drop{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid #cfd6e1;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:320px;overflow:auto;z-index:60}
.picker .opt{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f0f2f6;display:flex;justify-content:space-between;gap:10px}
.picker .opt:hover,.picker .opt.sel{background:var(--blue-l)}
.picker .opt .r{text-align:right;font-size:13px;white-space:nowrap}
.picker .empty{padding:12px;color:var(--muted)}

/* venda */
.venda-grid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.item-top{display:grid;grid-template-columns:1fr 90px 130px 110px 34px;gap:10px;align-items:end}
.item-top .nm{font-weight:700}
.item .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chipbtn{border:1px solid var(--line);background:#f7f9fc;border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.chipbtn:hover{border-color:var(--blue)}
.custo-line{font-size:13px;margin-top:6px;padding:7px 10px;border-radius:8px}
.custo-line.good{background:var(--ok-l);color:#0b6b3d}
.custo-line.warn{background:var(--warn-l);color:#6b4000}
.custo-line.bad{background:var(--bad-l);color:#8f1d15}
.resumo{position:sticky;top:60px}
.total{font-size:30px;font-weight:800;color:var(--blue-d)}
.xbtn{border:0;background:#f3f5f8;border-radius:8px;height:38px;cursor:pointer;color:var(--bad);font-size:18px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:100}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:900px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-h h2{font-size:18px;margin:0}
.modal-b{padding:16px 18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.close{border:0;background:#f3f5f8;width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.t{background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.t.erro{background:var(--bad)}
.t.ok{background:var(--dark)}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0%,#16325a,var(--dark) 60%)}
.login{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login .brand{margin-bottom:18px;flex-direction:column;align-items:center;gap:6px}
.login .brand b{color:var(--ink)}
.login form{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:#f0f2f6;border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.rc-prev{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:28px 30px;font:13px/1.55 Arial,Helvetica,sans-serif;color:#222;max-width:620px;margin:auto}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1.5px solid #bbb;padding-bottom:14px;margin-bottom:16px}
.rc-head img{width:190px;max-width:48%;border-radius:4px}
.rc-num{text-align:right}.rc-num b{font-size:19px;display:block}.rc-num span{color:#1a6fe0;font-weight:700;font-size:16px}
.rc-prev p{margin:0 0 14px;text-indent:1.6em}
.rc-ass{text-align:center;margin:26px 0 10px}.rc-ass img{width:200px;display:block;margin:0 auto -6px}.rc-ass div{border-top:1px solid #333;width:240px;margin:auto;padding-top:3px;font-size:11px;color:#555}
.rc-foot{border-top:1.5px solid #666;margin-top:22px;padding-top:6px;text-align:center;font-size:11px}.rc-foot i{color:#444}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;padding:10px;color:#000}
  html,body{background:#fff!important}
  #print-area h3{color:#222}
  #print-area table{width:100%;border-collapse:collapse}
  #print-area td,#print-area th{border-bottom:1px solid #999;padding:5px;text-align:left}
}

@media (max-width:860px){
  .venda-grid{grid-template-columns:1fr}
  .resumo{position:static}
  .grid4{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  main{padding:14px 12px 80px}
  .grid2,.grid3,.precos{grid-template-columns:1fr}
  .user span{display:none}
  .brandimg{height:36px}
  .top .brandsub{display:none}
  .item-top{grid-template-columns:1fr 1fr}
  .item-top .nm{grid-column:1/-1}
  .item-top .xbtn{grid-column:2;justify-self:end;width:44px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 4px}
  .tbl td{border:0;padding:4px 10px;display:flex;justify-content:space-between;gap:10px;text-align:right}
  .tbl td:first-child{display:block;text-align:left}
  .tbl td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left}
  .modal-b{padding:14px}
  .overlay{padding:10px 6px}
}
</style>
</head>

/* ====================== utilidades ====================== */
let sb, me = null, cfg = null, isAdmin = false;
let produtos = [], clientes = [];
let aba = 'painel';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const pct = (n) => (Number(n) || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const r2 = (n) => Math.round(((Number(n) || 0) + Number.EPSILON) * 100) / 100;
const f2 = (n) => r2(n).toFixed(2).replace('.', ',');
const fp = (n) => String(r2(n)).replace('.', ',');
function num(v) {
  if (typeof v === 'number') return v;
  v = String(v ?? '').trim().replace(/[R$\s%]/g, '');
  if (!v) return 0;
  if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(v); return isNaN(n) ? 0 : n;
}
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const dataBR = (d) => d ? new Date(d.length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('pt-BR') : '';
const dataHoraBR = (d) => d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const inicioDia = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };

const calcCusto = (compra, fora, imp) => num(compra) * (1 + (fora ? num(imp) / 100 : 0));
const precoPor = (custo, m) => r2(custo * (1 + num(m) / 100));
const margemPor = (custo, preco) => custo > 0 ? (num(preco) / custo - 1) * 100 : 0;
const prod = (id) => produtos.find((p) => p.id === id);
const cli = (id) => clientes.find((c) => c.id === id);

function toast(msg, tipo = 'ok') {
  const t = document.createElement('div'); t.className = 't ' + tipo; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), tipo === 'erro' ? 6000 : 3000);
}
function traduz(e) {
  const m = e?.message || e?.error_description || String(e);
  if (/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/already registered|already exists/i.test(m)) return 'Este e-mail já tem cadastro. Use "Entrar".';
  if (/Password should be|at least 6/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Veja sua caixa de entrada.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com o servidor. Verifique a internet.';
  if (/JWT|jwt expired/i.test(m)) return 'Sessão expirada. Entre novamente.';
  return m;
}
function erro(e) { console.error(e); toast(traduz(e), 'erro'); }
async function fetchAll(build) {
  const out = []; let from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
}

/* ====================== picker (busca com lista) ====================== */
function picker(id, placeholder) {
  return `<div class="picker"><input id="${id}" placeholder="${placeholder}" autocomplete="off"><div class="drop hide" id="${id}_d"></div></div>`;
}
function bindPicker(id, buscar, escolher) {
  const inp = document.getElementById(id), drop = document.getElementById(id + '_d');
  let itens = [], sel = 0;
  const show = () => {
    itens = buscar(inp.value); sel = 0;
    drop.innerHTML = itens.length ? itens.map((it, i) => `<div class="opt ${i === 0 ? 'sel' : ''}" data-i="${i}"><div>${it.l}</div><div class="r">${it.r || ''}</div></div>`).join('')
      : `<div class="empty">Nada encontrado</div>`;
    drop.classList.remove('hide');
  };
  inp.addEventListener('input', show);
  inp.addEventListener('focus', show);
  inp.addEventListener('keydown', (e) => {
    if (drop.classList.contains('hide')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); sel = Math.max(0, Math.min(itens.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)));
      drop.querySelectorAll('.opt').forEach((o, i) => o.classList.toggle('sel', i === sel));
      drop.querySelectorAll('.opt')[sel]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); if (itens[sel]) { drop.classList.add('hide'); escolher(itens[sel].v); } }
  });
  drop.addEventListener('mousedown', (e) => {
    const o = e.target.closest('.opt'); if (!o) return; e.preventDefault();
    drop.classList.add('hide'); escolher(itens[+o.dataset.i].v);
  });
  inp.addEventListener('blur', () => setTimeout(() => drop.classList.add('hide'), 150));
}
function buscaProdutos(t, max = 20) {
  const ws = norm(t).split(/\s+/).filter(Boolean);
  return produtos.filter((p) => p.ativo && ws.every((w) => norm(`${p.nome} ${p.codigo || ''} ${p.marca || ''} ${p.categoria || ''}`).includes(w)))
    .slice(0, max).map((p) => ({
      v: p, l: `<b>${esc(p.nome)}</b><br><small>${esc([p.categoria, p.marca, p.codigo].filter(Boolean).join(' · '))}</small>`,
      r: `<span class="tag ${p.estoque <= 0 ? 'bad' : ''}">${p.estoque} ${esc(p.unidade)}</span><br><small>Var. ${brl(p.preco_varejo)}</small>`
    }));
}

async function init() {
  const url = SUPABASE_URL || lsGet('sb_url'), key = SUPABASE_KEY || lsGet('sb_key');
  if (!url || !key) return telaSetup();
  if (!window.supabase) { $('#app').innerHTML = '<p style="padding:20px">Não foi possível carregar o sistema. Verifique a internet e recarregue a página.</p>'; return; }
  sb = supabase.createClient(url, key);
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { me = null; telaLogin(); } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  await entrar();
}

  $('#app').innerHTML = `<div class="login-wrap"><div class="login">

    <div class="seg"><button class="${modo === 'entrar' ? 'on' : ''}" onclick="telaLogin('entrar')">Entrar</button><button class="${modo === 'criar' ? 'on' : ''}" onclick="telaLogin('criar')">Criar conta</button></div>

      ${modo === 'criar' ? '<label>Seu nome<input id="lnome" required></label>' : ''}
      <label>E-mail<input id="lemail" type="email" required autocomplete="username"></label>
      <label>Senha<input id="lsenha" type="password" required minlength="6" autocomplete="${modo === 'criar' ? 'new-password' : 'current-password'}"></label>
      <button class="btn btn-primary" id="lbtn">${modo === 'criar' ? 'Criar conta' : 'Entrar'}</button>
      ${modo === 'criar' ? '<p class="hint">Depois de criar, o administrador precisa liberar seu acesso.</p>' : ''}
    </form></div></div>`;
  $('#flogin').onsubmit = async (e) => {
    e.preventDefault(); const b = $('#lbtn'); b.disabled = true;
    try {
      const email = $('#lemail').value.trim(), password = $('#lsenha').value;
      if (modo === 'criar') {
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nome: $('#lnome').value.trim() } } });
        if (error) throw error;
        if (!data.session) { toast('Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.'); return telaLogin('entrar'); }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
      await entrar();
    } catch (err) { erro(err); b.disabled = false; }
  };
}
async function entrar() {
  try {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) return telaLogin();
    const { data: perfil, error } = await sb.from('perfis').select('*').eq('id', user.id).maybeSingle();
    if (error) throw error;
    me = perfil;
    if (!me || me.papel === 'pendente' || me.papel === 'bloqueado') {
      const bloq = me?.papel === 'bloqueado';
      $('#app').innerHTML = `<div class="login-wrap"><div class="login">
        <div class="brand"><img class="brandimg" src="${LOGO}" alt="Beto Informática"><small class="brandsub">Estoque &amp; Vendas</small></div>
        <div class="alert ${bloq ? 'bad' : 'info'}">${bloq ? 'Seu acesso foi bloqueado pelo administrador.' : 'Conta criada! Aguarde o administrador liberar seu acesso e depois recarregue esta página.'}</div>
        <p class="hint">${esc(user.email)}</p>
        <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="location.reload()">Recarregar</button><button class="btn" onclick="sair()">Sair</button></div>
      </div></div>`;
      return;
    }
    isAdmin = me.papel === 'admin';
    await carregarBase();
    renderShell();
    ir(aba);
  } catch (e) { erro(e); telaLogin(); }
}
async function sair() { await sb.auth.signOut(); location.reload(); }

async function carregarBase() {
  const [c, ps, cs, cls] = await Promise.all([
    sb.from('config').select('*').eq('id', 1).single(),
    fetchAll(() => sb.from('produtos').select('*').order('nome')),
    isAdmin ? fetchAll(() => sb.from('produto_custos').select('*')) : Promise.resolve([]),
    fetchAll(() => sb.from('clientes').select('*').order('nome')),
  ]);
  if (c.error) throw c.error;
  cfg = c.data;
  const mc = new Map(cs.map((x) => [x.produto_id, x]));
  produtos = ps.map((p) => ({ ...p, c: mc.get(p.id) || null }));
  clientes = cls;
  try { await carregarBancos(); } catch (e) { bancos = []; catsFin = []; }
}
async function recarregarProdutos() {
  const [ps, cs] = await Promise.all([
    fetchAll(() => sb.from('produtos').select('*').order('nome')),
    isAdmin ? fetchAll(() => sb.from('produto_custos').select('*')) : Promise.resolve([]),
  ]);
  const mc = new Map(cs.map((x) => [x.produto_id, x]));
  produtos = ps.map((p) => ({ ...p, c: mc.get(p.id) || null }));
}

/* ====================== PAINEL ====================== */
async function telaPainel() {
  const at = produtos.filter((p) => p.ativo);
  const unid = at.reduce((s, p) => s + Math.max(0, p.estoque), 0);
  const vCusto = at.reduce((s, p) => s + Math.max(0, p.estoque) * (p.c?.custo_final || 0), 0);
  const vVar = at.reduce((s, p) => s + Math.max(0, p.estoque) * p.preco_varejo, 0);
  const baixo = at.filter((p) => p.estoque <= 0 || (p.estoque_minimo > 0 && p.estoque <= p.estoque_minimo));
  $('#main').innerHTML = `
    <div class="pagehead"><h1>Olá, ${esc(me.nome.split(' ')[0])}</h1><div class="actions"><button class="btn btn-primary" onclick="venda.tipo='venda';ir('vender')">🛒 Nova venda</button><button class="btn" onclick="venda.tipo='saida';ir('vender')">📤 Saída sem venda</button>${isAdmin ? `<button class="btn" onclick="ir('entrada')">📥 Dar entrada</button>` : ''}</div></div>
    <div class="kpis">
      <div class="kpi"><small>Produtos ativos</small><b>${at.length}</b></div>
      <div class="kpi"><small>Unidades em estoque</small><b>${unid}</b></div>
      ${isAdmin ? `<div class="kpi admin"><small>Estoque a preço de custo</small><b>${brl(vCusto)}</b></div>` : ''}
      <div class="kpi"><small>Estoque a preço de varejo</small><b>${brl(vVar)}</b></div>
      <div class="kpi"><small>Vendas hoje</small><b id="k_hoje">…</b></div>
      <div class="kpi"><small>Vendas no mês</small><b id="k_mes">…</b></div>
      ${isAdmin ? `<div class="kpi admin"><small>Lucro real no mês</small><b id="k_lucro">…</b><small id="k_lucro_d" style="text-transform:none"></small></div>
        <div class="kpi admin click" style="cursor:pointer" onclick="finAba='caixa';ir('financeiro')"><small>Saldo do caixa</small><b id="k_caixa">…</b></div>
        <div class="kpi admin" style="cursor:pointer" onclick="finAba='receber';finFil.status='vencida';ir('financeiro')"><small>A receber vencido</small><b id="k_rec">…</b></div>
        <div class="kpi admin" style="cursor:pointer" onclick="finAba='pagar';finFil.status='aberta';ir('financeiro')"><small>A pagar (vencidas + 7 dias)</small><b id="k_pag">…</b></div>` : ''}
    </div>
    <div class="grid2">
      <div class="card"><h3 style="margin-top:0">Estoque baixo / zerado (${baixo.length})</h3>
        ${baixo.length ? `<table class="tbl"><tbody>${baixo.slice(0, 15).map((p) => `<tr class="click" onclick="verProduto(${p.id})"><td class="pn">${esc(p.nome)}</td><td class="num" data-l="Estoque"><span class="tag ${p.estoque <= 0 ? 'bad' : 'warn'}">${p.estoque} ${esc(p.unidade)}</span></td></tr>`).join('')}</tbody></table>${baixo.length > 15 ? `<p class="hint">e mais ${baixo.length - 15}…</p>` : ''}` : '<p class="muted">Tudo certo por aqui 👍</p>'}
      </div>
      <div class="card"><h3 style="margin-top:0">Últimas vendas e saídas</h3><div id="p_ult"><p class="muted">Carregando…</p></div></div>
    </div>`;
  try {
    const hoje = inicioDia(hojeISO()), mes = new Date(hoje.getFullYear(), hoje.getMonth(), 1), amanha = new Date(hoje.getTime() + 864e5);
    const [vh, vm, ult] = await Promise.all([
      fetchAll(() => sb.from('vendas').select('total').eq('status', 'concluida').eq('tipo', 'venda').gte('data', hoje.toISOString())),
      fetchAll(() => sb.from('vendas').select('total').eq('status', 'concluida').eq('tipo', 'venda').gte('data', mes.toISOString())),
      sb.from('vendas').select('*').order('data', { ascending: false }).limit(8),
    ]);
    const s = (a) => a.reduce((t, v) => t + Number(v.total), 0);
    $('#k_hoje').textContent = brl(s(vh)); $('#k_mes').textContent = brl(s(vm));
    $('#p_ult').innerHTML = ult.data?.length ? `<table class="tbl"><tbody>${ult.data.map((v) => `<tr class="click ${v.status === 'cancelada' ? 'cancel' : ''}" onclick="verVenda(${v.id})"><td><span class="pn">${esc(v.cliente_nome)}</span>${v.tipo === 'saida' ? ' <span class="tag warn">SAÍDA</span>' : ''}<div class="sub">#${v.id} · ${dataHoraBR(v.data)}</div></td><td class="num" data-l="Total">${v.tipo === 'saida' ? '—' : brl(v.total)}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Nenhuma venda ainda.</p>';

function categorias() { return [...new Set(produtos.map((p) => p.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b)); }
function telaProdutos() {
  $('#main').innerHTML = `
    <div class="pagehead"><h1>Produtos</h1><div class="actions">
      ${isAdmin ? `<button class="btn btn-primary" onclick="formProduto()">+ Novo produto</button><button class="btn" onclick="importarLista()">Importar lista</button>` : ''}
      <button class="btn" onclick="exportarProdutos()">Exportar planilha</button></div></div>
    <div class="card filtros">
      <input id="fb" placeholder="🔎 Buscar por nome, código, marca..." oninput="listaProdutos()">
      <select id="fc" onchange="listaProdutos()"><option value="">Todas as categorias</option>${categorias().map((c) => `<option>${esc(c)}</option>`).join('')}</select>

function listaProdutos() {
  const ws = norm($('#fb').value).split(/\s+/).filter(Boolean), cat = $('#fc').value, bx = $('#fbx').checked, inat = $('#fin')?.checked;
  const l = produtos.filter((p) => (inat || p.ativo) && (!cat || p.categoria === cat)
    && (!bx || p.estoque <= 0 || (p.estoque_minimo > 0 && p.estoque <= p.estoque_minimo))
    && ws.every((w) => norm(`${p.nome} ${p.codigo || ''} ${p.marca || ''} ${p.categoria || ''}`).includes(w)));
  $('#lprod').innerHTML = !l.length ? `<p class="muted">${produtos.length ? 'Nenhum produto encontrado.' : 'Nenhum produto cadastrado ainda.' + (isAdmin ? ' Clique em "+ Novo produto" ou "Importar lista".' : '')}</p>` : `
    <table class="tbl"><thead><tr><th>Produto</th><th class="num">Estoque</th>${isAdmin ? '<th class="num">Custo final</th>' : ''}<th class="num">Atacado</th><th class="num">Varejo</th></tr></thead>
    <tbody>${l.map((p) => {
      const b = p.estoque <= 0 ? 'bad' : (p.estoque_minimo > 0 && p.estoque <= p.estoque_minimo) ? 'warn' : 'ok';
      return `<tr class="click" onclick="verProduto(${p.id})">
        <td><div class="pn">${esc(p.nome)} ${p.ativo ? '' : '<span class="tag">inativo</span>'}</div><div class="sub">${esc([p.categoria, p.marca, p.codigo].filter(Boolean).join(' · '))}</div></td>
        <td class="num" data-l="Estoque"><span class="tag ${b}">${p.estoque} ${esc(p.unidade)}</span></td>
        ${isAdmin ? `<td class="num" data-l="Custo final">${p.c ? brl(p.c.custo_final) + (p.c.fora_estado ? ` <small>(+${fp(p.c.imposto_pct)}%)</small>` : '') : '—'}</td>` : ''}
        <td class="num" data-l="Atacado">${brl(p.preco_atacado)}</td>
        <td class="num" data-l="Varejo"><b>${brl(p.preco_varejo)}</b></td></tr>`;
    }).join('')}</tbody></table>
    <p class="hint">${l.length} produto(s)</p>`;
}

  const imp = c.imposto_pct ?? cfg.imposto_fora_pct, fora = c.fora_estado ?? true;
  const ma = c.margem_atacado_pct ?? cfg.margem_atacado_pct, mv = c.margem_varejo_pct ?? cfg.margem_varejo_pct;
  openModal(p ? 'Editar produto' : 'Novo produto', `
    <div class="grid2">
      <label class="full">Nome do produto *<input id="pf_nome" value="${esc(p?.nome)}" placeholder="Ex.: Toner HP 85A compatível"></label>
      <label>Categoria<input id="pf_cat" list="dl_cat" value="${esc(p?.categoria)}" placeholder="Ex.: Toner"></label>
      <datalist id="dl_cat">${categorias().map((x) => `<option value="${esc(x)}">`).join('')}</datalist>
      <label>Marca<input id="pf_marca" value="${esc(p?.marca)}"></label>
      <label>Código / referência<input id="pf_cod" value="${esc(p?.codigo)}"></label>
      <label>Unidade<select id="pf_un">${['un', 'cx', 'pct', 'kit', 'm', 'par'].map((u) => `<option ${p?.unidade === u ? 'selected' : ''}>${u}</option>`).join('')}</select></label>
      <label>Estoque mínimo (avisa quando chegar)<input id="pf_min" type="number" min="0" value="${p?.estoque_minimo ?? 0}"></label>
      ${p ? '' : '<label>Quantidade que já tenho em estoque<input id="pf_qtd" type="number" min="0" value="0"></label>'}
    </div>
    <div class="calc">
      <h3>Custo</h3>
      <div class="grid4">
        <label>Preço de compra (R$)<input id="pf_compra" inputmode="decimal" value="${c.preco_compra != null ? f2(c.preco_compra) : ''}" placeholder="0,00"></label>
        <label class="chk" style="padding-bottom:10px"><input type="checkbox" id="pf_fora" ${fora ? 'checked' : ''}> Comprado fora do estado</label>
        <label>Imposto fora do estado (%)<input id="pf_imp" inputmode="decimal" value="${fp(imp)}"></label>
        <label>Frete por unidade (R$)<input id="pf_frete" inputmode="decimal" value="${f2(c.frete_unit || 0)}"></label>
      </div>
      <div class="custo-final">Custo final por unidade: <b id="pf_custo">R$ 0,00</b> <small id="pf_cdet"></small></div>
      <h3>Preços de venda</h3>
      <div class="precos">
        <div class="preco-box"><div class="lbl">ATACADO</div>
          <label>Margem (%)<input id="pf_ma" inputmode="decimal" value="${fp(ma)}"></label>
          <label>Preço (R$)<input id="pf_pa" inputmode="decimal" value="${p ? f2(p.preco_atacado) : ''}"></label>
          <div class="lucro" id="pf_la"></div></div>
        <div class="preco-box"><div class="lbl">VAREJO</div>
          <label>Margem (%)<input id="pf_mv" inputmode="decimal" value="${fp(mv)}"></label>
          <label>Preço (R$)<input id="pf_pv" inputmode="decimal" value="${p ? f2(p.preco_varejo) : ''}"></label>
          <div class="lucro" id="pf_lv"></div></div>
      </div>
      <p class="hint">Digite a margem e o preço é calculado — ou digite o preço e a margem é recalculada.</p>
    </div>
    <label>Observação<textarea id="pf_obs">${esc(p?.observacao)}</textarea></label>
    ${p ? `<label class="chk" style="margin-top:10px"><input type="checkbox" id="pf_ativo" ${p.ativo ? 'checked' : ''}> Produto ativo (desmarque para esconder sem apagar)</label>` : ''}
  `, `${p ? `<button class="btn btn-danger" style="margin-right:auto" onclick="excluirProduto(${p.id})">Excluir</button>` : ''}<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="pf_save" onclick="salvarProduto(${p?.id || 'null'})">Salvar produto</button>`, true);

  const g = (i) => document.getElementById(i);
  const custo = () => calcCusto(g('pf_compra').value, g('pf_fora').checked, g('pf_imp').value) + num(g('pf_frete').value);
  const lucros = () => {
    const cu = custo();
    g('pf_la').textContent = cu ? `Lucro: ${brl(num(g('pf_pa').value) - cu)} por unidade` : '';
    g('pf_lv').textContent = cu ? `Lucro: ${brl(num(g('pf_pv').value) - cu)} por unidade` : '';
  };
  const upCusto = (recalcPrecos) => {
    const cu = custo(); g('pf_imp').disabled = !g('pf_fora').checked;
    g('pf_custo').textContent = brl(cu);
    const fr = num(g('pf_frete').value), cp = num(g('pf_compra').value);
    g('pf_cdet').textContent = cp && (g('pf_fora').checked || fr) ? `(${brl(cp)}${g('pf_fora').checked ? ` + ${fp(num(g('pf_imp').value))}%` : ''}${fr ? ` + frete ${brl(fr)}` : ''} = ${brl(cu)})` : '';
    if (recalcPrecos) { g('pf_pa').value = f2(precoPor(cu, g('pf_ma').value)); g('pf_pv').value = f2(precoPor(cu, g('pf_mv').value)); }
    lucros();
  };
  ['pf_compra', 'pf_imp', 'pf_frete'].forEach((i) => g(i).addEventListener('input', () => upCusto(true)));
  g('pf_fora').addEventListener('change', () => upCusto(true));
  g('pf_ma').addEventListener('input', () => { g('pf_pa').value = f2(precoPor(custo(), g('pf_ma').value)); lucros(); });
  g('pf_mv').addEventListener('input', () => { g('pf_pv').value = f2(precoPor(custo(), g('pf_mv').value)); lucros(); });
  g('pf_pa').addEventListener('input', () => { g('pf_ma').value = fp(margemPor(custo(), g('pf_pa').value)); lucros(); });
  g('pf_pv').addEventListener('input', () => { g('pf_mv').value = fp(margemPor(custo(), g('pf_pv').value)); lucros(); });
  upCusto(!p);
}
async function salvarProduto(id) {
  const g = (i) => document.getElementById(i)?.value;
  if (!g('pf_nome').trim()) return toast('Informe o nome do produto', 'erro');
  if (!id && produtos.some((p) => norm(p.nome) === norm(g('pf_nome').trim())) && !confirm('Já existe um produto com esse nome. Cadastrar mesmo assim?')) return;
  const body = {
    id, nome: g('pf_nome'), categoria: g('pf_cat'), marca: g('pf_marca'), codigo: g('pf_cod'), unidade: g('pf_un'),
    estoque_minimo: parseInt(g('pf_min')) || 0, observacao: g('pf_obs'),
    preco_compra: Math.round(num(g('pf_compra')) * 10000) / 10000, frete_unit: r2(num(g('pf_frete'))), fora_estado: $('#pf_fora').checked, imposto_pct: num(g('pf_imp')),
    margem_atacado_pct: r2(num(g('pf_ma'))), margem_varejo_pct: r2(num(g('pf_mv'))),
    preco_atacado: r2(num(g('pf_pa'))), preco_varejo: r2(num(g('pf_pv'))),
    estoque_inicial: id ? 0 : parseInt(g('pf_qtd')) || 0,
    ativo: id ? $('#pf_ativo').checked : true,
  };
  $('#pf_save').disabled = true;
  try {
    const { data, error } = await sb.rpc('salvar_produto', { p: body });
    if (error) throw error;
    await recarregarProdutos(); closeModal(); toast('Produto salvo ✔');
    if (aba === 'produtos') telaProdutos(); else if (aba === 'entrada') { telaEntrada(); entradaAdd(prod(data)); }
  } catch (e) { erro(e); $('#pf_save').disabled = false; }
}
async function excluirProduto(id) {
  const p = prod(id);
  if (!confirm(`Excluir "${p.nome}" definitivamente?\n\nIsso apaga também o histórico de entradas dele. As vendas antigas continuam registradas.\n\nDica: se só quer esconder, desmarque "Produto ativo".`)) return;
  const { error } = await sb.from('produtos').delete().eq('id', id);
  if (error) return erro(error);
  await recarregarProdutos(); closeModal(); toast('Produto excluído'); ir(aba);
}

async function verProduto(id) {
  const p = prod(id); if (!p) return;
  const c = p.c;
  openModal(esc(p.nome), `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      ${p.categoria ? `<span class="tag blue">${esc(p.categoria)}</span>` : ''}${p.marca ? `<span class="tag">${esc(p.marca)}</span>` : ''}${p.codigo ? `<span class="tag">Cód. ${esc(p.codigo)}</span>` : ''}
      <span class="tag ${p.estoque <= 0 ? 'bad' : (p.estoque_minimo > 0 && p.estoque <= p.estoque_minimo) ? 'warn' : 'ok'}">Estoque: ${p.estoque} ${esc(p.unidade)}</span>

async function salvarAjuste(id) {

  const { error } = await sb.rpc('ajustar_estoque', { p_produto_id: id, p_nova: q, p_motivo: $('#aj_m').value });
  if (error) return erro(error);
  await recarregarProdutos(); toast('Estoque ajustado ✔'); verProduto(id); if (aba === 'produtos') listaProdutos();
}
function exportarProdutos() {
  const cab = ['Nome', 'Categoria', 'Marca', 'Código', 'Unidade', 'Estoque', 'Estoque mínimo'];
  if (isAdmin) cab.push('Preço compra', 'Fora do estado', 'Imposto %', 'Frete/un', 'Custo final');
  cab.push('Preço atacado', 'Preço varejo', 'Ativo');
  const linhas = produtos.map((p) => {
    const l = [p.nome, p.categoria, p.marca, p.codigo, p.unidade, p.estoque, p.estoque_minimo];
    if (isAdmin) l.push(f2(p.c?.preco_compra), p.c?.fora_estado ? 'Sim' : 'Não', fp(p.c?.imposto_pct || 0), f2(p.c?.frete_unit), f2(p.c?.custo_final));
    l.push(f2(p.preco_atacado), f2(p.preco_varejo), p.ativo ? 'Sim' : 'Não');
    return l;
  });
  const csv = [cab, ...linhas].map((l) => l.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  baixar(`estoque-beto-${hojeISO()}.csv`, '﻿' + csv, 'text/csv;charset=utf-8');
}

function previewImport() {

async function executarImport() {
  const l = lerImport().filter((x) => !produtos.some((p) => norm(p.nome) === norm(x.nome)));
  if (!l.length) return toast('Nada novo para importar', 'erro');
  const fora = $('#im_fora').checked, ma = num($('#im_ma').value), mv = num($('#im_mv').value), imp = cfg.imposto_fora_pct;
  const b = $('#im_go'); b.disabled = true; let ok = 0;
  for (const x of l) {
    const cu = calcCusto(x.compra, fora, imp);
    const { error } = await sb.rpc('salvar_produto', { p: { nome: x.nome, categoria: x.categoria, marca: x.marca, preco_compra: r2(x.compra), fora_estado: fora, imposto_pct: imp, margem_atacado_pct: ma, margem_varejo_pct: mv, preco_atacado: precoPor(cu, ma), preco_varejo: precoPor(cu, mv), estoque_inicial: x.qtd } });
    if (error) { erro(error); break; }
    ok++; b.textContent = `Importando ${ok}/${l.length}…`;
  }
  await recarregarProdutos(); closeModal(); toast(`${ok} produto(s) importado(s) ✔`); telaProdutos();
}

async function checarNota() {
  ent.existente = null;
  const n = ent.documento.trim(), f = ent.fornecedor.trim();
  if (n && (f || ent.cnpj)) {
    let q = sb.from('notas').select('id,frete,fornecedor,numero,chave,entradas(quantidade,preco_compra)').eq('numero', n);
    q = ent.cnpj ? q.or(`cnpj.eq.${ent.cnpj},fornecedor.ilike.${f.replace(/[%_,()]/g, '')}`) : q.ilike('fornecedor', f.replace(/[%_]/g, ''));
    const { data } = await q.limit(1);
    if (data?.[0]) {
      const x = data[0];
      ent.existente = { id: x.id, frete: Number(x.frete), itens: x.entradas.length, soma: x.entradas.reduce((s, e) => s + e.quantidade * e.preco_compra, 0) };

function renderExistente() {

}

/* ---------- XML da NF-e ---------- */
async function importarXML(file) {
  if (!file) return;
  try {
    const txt = await file.text();
    const d = new DOMParser().parseFromString(txt, 'text/xml');
    if (d.getElementsByTagName('parsererror').length) throw new Error('Arquivo XML inválido.');
    const inf = d.getElementsByTagName('infNFe')[0];
    if (!inf) throw new Error('Este arquivo não parece ser o XML de uma NF-e.');
    const tag = (el, t) => el ? el.getElementsByTagName(t)[0] : null;
    const g = (el, t) => tag(el, t)?.textContent?.trim() || '';
    const gn = (el, t) => parseFloat(g(el, t)) || 0;
    const ide = tag(inf, 'ide'), emit = tag(inf, 'emit'), dest = tag(inf, 'dest'), tot = tag(inf, 'ICMSTot');
    const chave = (inf.getAttribute('Id') || '').replace(/^NFe/, '');
    const cnpj = (g(emit, 'CNPJ') || g(emit, 'CPF')).replace(/\D/g, '');
    const ufE = g(tag(emit, 'enderEmit'), 'UF'), ufD = g(tag(dest, 'enderDest'), 'UF');
    if (chave) {
      const { data: ja } = await sb.from('notas').select('id').eq('chave', chave).limit(1);
      if (ja?.length) throw new Error('Esta nota já foi lançada antes (mesma chave de acesso).');
    }
    if (ent.itens.length && !confirm('Já tem itens na tela. Substituir pelos itens do XML?')) return;
    const { data: cods } = cnpj ? await sb.from('codigos_fornecedor').select('*').eq('cnpj', cnpj) : { data: [] };
    const mapCod = new Map((cods || []).map((c) => [c.codigo, c.produto_id]));
    const porCodigo = (c) => c && produtos.find((p) => p.codigo && p.codigo.trim() === c);
    const porNome = (n) => produtos.find((p) => norm(p.nome) === norm(n));
    const itens = [...inf.getElementsByTagName('det')].map((det) => {
      const p = tag(det, 'prod'), imp = tag(det, 'imposto');
      const cProd = g(p, 'cProd'), cEAN = /^\d{8,14}$/.test(g(p, 'cEAN')) ? g(p, 'cEAN') : '', xProd = g(p, 'xProd');
      const qCom = gn(p, 'qCom'), uCom = g(p, 'uCom');
      const valor = gn(p, 'vProd') - gn(p, 'vDesc') + gn(p, 'vOutro') + gn(tag(imp, 'IPI'), 'vIPI') + gn(tag(imp, 'ICMS'), 'vICMSST');
      const qtd = Math.max(1, Math.round(qCom));
      let pid = mapCod.get(cProd) || porCodigo(cEAN)?.id || porCodigo(cProd)?.id || porNome(xProd)?.id || null;
      if (pid && !prod(pid)) pid = null;
      return {
        pid, auto: !!pid, qtd, valor, compra: valor / qtd,
        xml: { cProd, cEAN, xProd, uCom, qCom },
        novo: pid ? null : { nome: xProd, categoria: '', codigo: cEAN || cProd, unidade: 'un' },
      };
    });
    if (!itens.length) throw new Error('Nenhum produto encontrado no XML.');
    ent = { ...entNovo(), atualizar: ent.atualizar, itens, chave, cnpj,
      fornecedor: g(emit, 'xNome'), documento: g(ide, 'nNF'), data: (g(ide, 'dhEmi') || g(ide, 'dEmi')).slice(0, 10) || hojeISO(),
      fora: ufE && ufD ? ufE !== ufD : true, frete: gn(tot, 'vFrete'), imp: cfg.imposto_fora_pct };
    telaEntrada();
    await checarNota();
    const aut = itens.filter((i) => i.pid).length;
    toast(`XML lido: ${itens.length} item(ns) · ${aut} vinculado(s) automaticamente · ${itens.length - aut} novo(s)`);
    if (itens.some((i) => i.xml.qCom % 1)) toast('Atenção: tem item com quantidade fracionada na nota — confira as quantidades.', 'erro');
  } catch (e) { erro(e); }
}

function entTrocar(i) { ent.itens[i].trocando = !ent.itens[i].trocando; renderEntrada(); if (ent.itens[i].trocando) setTimeout(() => $('#enp_' + i)?.focus(), 50); }
function entVincular(i, p) {
  const it = ent.itens[i];
  it.trocando = false;
  if (p === '__novo') { it.pid = null; it.auto = false; it.novo = it.novo || { nome: it.xml?.xProd || '', categoria: '', codigo: it.xml?.cEAN || it.xml?.cProd || '', unidade: 'un' }; }
  else { it.pid = p.id; it.auto = false; }

}
function entQtd(i, v) {
  const it = ent.itens[i]; it.qtd = parseInt(v) || 0;
  if (it.valor != null && it.qtd > 0) { it.compra = it.valor / it.qtd; const e = $('#ec_' + i); if (e) e.value = f2(it.compra); }

      : `${dif < 0 ? 'Custo caiu — preços mantidos' : 'Preços mantidos'} → Atacado ${brl(p.preco_atacado)} (${pct(margemPor(novo, p.preco_atacado))}) · Varejo ${brl(p.preco_varejo)} (${pct(margemPor(novo, p.preco_varejo))})`}
    </div>`;
  });
  const r = $('#en_resumo');
  if (r) r.innerHTML = `<div class="kpis" style="margin:0">
      <div class="kpi"><small>Produtos desta entrada</small><b>${brl(somaNova)}</b></div>
      ${ent.fora ? `<div class="kpi"><small>Imposto fora (${fp(ent.imp)}%)</small><b>${brl(somaNova * impF)}</b></div>` : ''}

    </div>`;
}
async function registrarEntrada() {

  if (ent.itens.some((i) => !i.pid && !i.novo?.nome?.trim())) return toast('Tem produto novo sem nome', 'erro');

  const novos = ent.itens.filter((i) => !i.pid).length;

function setPreco(i, v) { venda.itens[i].preco = v; $('#vp_' + i).value = f2(v); atualizaLinha(i); }

    out.push(`<div class="custo-line ${cls}">Custo atual (c/ imposto e frete): <b>${brl(cu)}</b> · Lucro neste preço: <b>${brl(luc)}/un (${pct(m)})</b>${cls === 'bad' ? ' — <b>PREJUÍZO</b>' : cls === 'warn' ? ` — abaixo da margem mínima (${pct(cfg.margem_minima_pct)})` : ''}</div>`);

}
function verHist(i) {

function totalVenda() {

async function finalizarVenda() {

  if (falta) return toast(`Estoque insuficiente: ${prod(falta.pid).nome}`, 'erro');
  if (sd && !venda.destino.trim() && !venda.cliente) { toast('Informe para onde foi / quem recebeu', 'erro'); $('#vd_dest')?.focus(); return; }
  if (!sd && venda.cond === 'prazo' && !venda.cliente) return toast('Venda a prazo: escolha o cliente (quem vai pagar)', 'erro');
  if (!sd && venda.cond === 'prazo' && !venda.venc) return toast('Informe o 1º vencimento', 'erro');
  if (!sd && venda.cond === 'avista' && venda.caixa === null) return toast('Responda: lançar esta venda no fluxo de caixa? (Sim ou Não)', 'erro');
  if (!sd && isAdmin && venda.itens.some((i) => prod(i.pid).c && i.preco <= prod(i.pid).c.custo_final) && !confirm('Tem produto sendo vendido abaixo do custo. Finalizar mesmo assim?')) return;
  const b = $('#vd_go'); b.disabled = true;
  const { data, error } = await sb.rpc('registrar_venda', {
    p_cliente_id: venda.cliente?.id || null,
    p_itens: venda.itens.map((i) => ({ produto_id: i.pid, quantidade: i.qtd, preco_unit: sd ? 0 : r2(i.preco), salvar_preco: !sd && !!i.salvar })),
    p_forma: sd ? null : venda.forma, p_obs: venda.obs, p_tipo: venda.tipo, p_destino: sd ? venda.destino : null,
    p_condicao: venda.cond, p_caixa: !sd && venda.cond === 'avista' && venda.caixa === true,

  });
  if (error) { b.disabled = false; return erro(error); }
  venda = vendaNova(venda.tipo);
  await recarregarProdutos();
  telaVender();
  toast(sd ? 'Saída registrada ✔' : 'Venda registrada ✔');
  verVenda(data.id, true);
}

let vfil = { per: 'mes', ini: '', fim: '', tipo: '' };
function periodo() {
  const h = inicioDia(hojeISO()), dia = 864e5;
  if (vfil.per === 'hoje') return [h, new Date(+h + dia)];
  if (vfil.per === '7') return [new Date(+h - 6 * dia), new Date(+h + dia)];
  if (vfil.per === 'mes') return [new Date(h.getFullYear(), h.getMonth(), 1), new Date(+h + dia)];
  if (vfil.per === 'mesant') return [new Date(h.getFullYear(), h.getMonth() - 1, 1), new Date(h.getFullYear(), h.getMonth(), 1)];
  return [inicioDia(vfil.ini || hojeISO()), new Date(+inicioDia(vfil.fim || hojeISO()) + dia)];
}

function extenso(valor) {
  const U = ['', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const D = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  const C = ['', 'cento', 'duzentos', 'trezentos', 'quatrocentos', 'quinhentos', 'seiscentos', 'setecentos', 'oitocentos', 'novecentos'];
  const ate999 = (n) => {
    if (n === 100) return 'cem';
    const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(C[c]);
    if (r) p.push(r < 20 ? U[r] : D[Math.floor(r / 10)] + (r % 10 ? ' e ' + U[r % 10] : ''));
    return p.join(' e ');
  };
  const inteiro = (n) => {
    if (n === 0) return 'zero';
    const grupos = [['', ''], ['mil', 'mil'], ['milhão', 'milhões'], ['bilhão', 'bilhões']];
    const partes = []; let i = 0, ultimo = 0;
    while (n > 0) {
      const g = n % 1000;
      if (g) {
        let t = i === 1 && g === 1 ? 'mil' : ate999(g) + (i ? ' ' + (g === 1 ? grupos[i][0] : grupos[i][1]) : '');
        partes.unshift({ t, g, i });
      }
      n = Math.floor(n / 1000); i++;
    }
    return partes.map((p, k) => {
      if (k === 0) return p.t;
      return ((p.g < 100 || p.g % 100 === 0) ? ' e ' : ' ') + p.t;
    }).join('');
  };
  const v = Math.round((Number(valor) || 0) * 100), re = Math.floor(v / 100), ce = v % 100;
  const out = [];
  if (re) { let t = inteiro(re); if (re >= 1e6 && re % 1e6 === 0) t += ' de'; out.push(t + (re === 1 ? ' real' : ' reais')); }
  if (ce) out.push(inteiro(ce) + (ce === 1 ? ' centavo' : ' centavos'));
  return out.join(' e ') || 'zero reais';
}

/* ====================== FINANCEIRO ====================== */
let finAba = 'caixa';
let finFil = { mes: '', status: 'aberta', busca: '', banco: '' };
let bancos = [], catsFin = [];
const mesAtual = () => hojeISO().slice(0, 7);
const fimMes = (m) => { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm, 0); return `${m}-${String(d.getDate()).padStart(2, '0')}`; };
const diasAte = (iso) => Math.round((inicioDia(iso) - inicioDia(hojeISO())) / 864e5);
const sinal = (x) => (x.tipo === 'entrada' ? 1 : -1) * Number(x.valor);
const bancoPadrao = () => bancos.filter((b) => b.ativo).sort((a, b) => a.ordem - b.ordem || a.id - b.id)[0]?.id || null;
const nomeBanco = (id) => bancos.find((b) => b.id === id)?.nome || '—';
async function carregarBancos() {
  const [b, c] = await Promise.all([
    fetchAll(() => sb.from('bancos').select('*').order('ordem').order('id')),
    isAdmin ? fetchAll(() => sb.from('categorias').select('*').order('nome')) : Promise.resolve([]),
  ]);
  bancos = b; catsFin = c;
}
function bancoSel(id, sel, extra = '') {
  const l = bancos.filter((b) => b.ativo || b.id === sel);
  const v = sel ?? bancoPadrao();
  return `<select id="${id}" ${extra}>${l.map((b) => `<option value="${b.id}" ${b.id === v ? 'selected' : ''}>${esc(b.nome)}</option>`).join('')}</select>`;
}
function catSel(id, tipo, sel) {
  const l = catsFin.filter((c) => (c.ativo && (c.tipo === tipo || c.tipo === 'ambos' || !tipo)) || c.nome === sel).map((c) => c.nome);
  if (sel && !l.includes(sel)) l.unshift(sel);
  return `<select id="${id}"><option value="">(sem categoria)</option>${l.map((n) => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
}
async function saldosBancos() {
  const cx = await fetchAll(() => sb.from('caixa').select('tipo,valor,banco_id'));
  const m = new Map(bancos.map((b) => [b.id, Number(b.saldo_inicial) || 0]));
  cx.forEach((x) => m.set(x.banco_id, (m.get(x.banco_id) || 0) + sinal(x)));
  return m;
}

async function painelFinanceiro() {
  try {
    const hoje = hojeISO(), em7 = maisDias(7);
    const [sm_, rec, pag] = await Promise.all([
      saldosBancos(),
      fetchAll(() => sb.from('contas').select('valor').eq('tipo', 'receber').is('pago_em', null).lt('vencimento', hoje)),
      fetchAll(() => sb.from('contas').select('valor').eq('tipo', 'pagar').is('pago_em', null).lte('vencimento', em7)),
    ]);
    const saldo = [...sm_.values()].reduce((s, v) => s + v, 0);
    const sm = (a) => a.reduce((s, x) => s + Number(x.valor), 0);
    if ($('#k_caixa')) { $('#k_caixa').textContent = brl(saldo); $('#k_caixa').style.color = saldo < 0 ? 'var(--bad)' : ''; }
    if ($('#k_rec')) { $('#k_rec').textContent = brl(sm(rec)); $('#k_rec').style.color = sm(rec) ? 'var(--warn)' : ''; }
    if ($('#k_pag')) { $('#k_pag').textContent = brl(sm(pag)); $('#k_pag').style.color = sm(pag) ? 'var(--bad)' : ''; }
  } catch (e) { erro(e); }
}

async function vendaFinanceiro(v) {
  const [cx, ct] = await Promise.all([
    sb.from('caixa').select('id,data,valor,forma,banco_id').eq('venda_id', v.id),
    sb.from('contas').select('*').eq('venda_id', v.id).order('vencimento'),
  ]);
  const el = $('#vv_fin'); if (!el) return;
  if (ct.data?.length) {
    el.innerHTML = `<h3>Contas a receber desta venda</h3><table class="tbl"><tbody>${ct.data.map((c) => `<tr><td>${c.parcela ? esc(c.parcela) : 'Parcela única'}</td><td data-l="Vencimento">${dataBR(c.vencimento)}</td><td class="num" data-l="Valor">${brl(c.valor)}</td><td class="num">${statusConta(c)}</td></tr>`).join('')}</tbody></table>`;
  } else if (cx.data?.length) {
    el.innerHTML = `<div class="alert ok" style="margin-top:10px">✔ Lançada no fluxo de caixa em ${dataBR(cx.data[0].data)} · <b>${esc(nomeBanco(cx.data[0].banco_id))}</b>${cx.data[0].forma ? ' · ' + esc(cx.data[0].forma) : ''}.</div>`;
  } else {
    el.innerHTML = `<div class="alert info" style="margin-top:10px">Esta venda <b>não está</b> no fluxo de caixa. Lançar em ${bancoSel('vv_banco')} <button class="chipbtn" onclick="vendaParaCaixa(${v.id})">💰 Lançar no caixa agora</button></div>`;
    $('#vv_banco').style.width = 'auto';
  }
}
async function vendaParaCaixa(id) {
  const { error } = await sb.rpc('venda_para_caixa', { p_id: id, p_forma: null, p_banco: +$('#vv_banco').value || null });
  if (error) return erro(error);
  toast('Venda lançada no caixa ✔'); verVenda(id);
}

function statusConta(c) {
  if (c.pago_em) return `<span class="tag ok">${c.tipo === 'receber' ? 'Recebida' : 'Paga'} ${dataBR(c.pago_em)}</span>`;
  const d = diasAte(c.vencimento);
  if (d < 0) return `<span class="tag bad">Vencida há ${-d} dia${d === -1 ? '' : 's'}</span>`;
  if (d === 0) return `<span class="tag warn">Vence hoje</span>`;
  if (d <= 7) return `<span class="tag warn">Vence em ${d} dia${d === 1 ? '' : 's'}</span>`;
  return `<span class="tag">Em aberto</span>`;
}

async function telaFinanceiro() {
  if (!finFil.mes) finFil.mes = mesAtual();
  $('#main').innerHTML = `
    <div class="pagehead"><h1>Financeiro</h1></div>
    <div class="seg" style="max-width:860px;overflow-x:auto">
      <button class="${finAba === 'caixa' ? 'on' : ''}" onclick="finAba='caixa';telaFinanceiro()">💵 Fluxo de caixa</button>
      <button class="${finAba === 'pagar' ? 'on' : ''}" onclick="finAba='pagar';telaFinanceiro()">📤 Contas a pagar</button>
      <button class="${finAba === 'receber' ? 'on' : ''}" onclick="finAba='receber';telaFinanceiro()">📥 Contas a receber</button>
      <button class="${finAba === 'cadastros' ? 'on' : ''}" onclick="finAba='cadastros';telaFinanceiro()">🏦 Bancos e categorias</button>
    </div>
    <div id="fin_body"><p class="muted">Carregando…</p></div>`;
  try { await carregarBancos(); } catch (e) { return erro(e); }
  if (finAba === 'caixa') telaCaixa(); else if (finAba === 'cadastros') telaCadastrosFin(); else telaContas(finAba);
}

/* ---------- Fluxo de caixa ---------- */
let caixaCache = [];
async function telaCaixa() {
  const bf = finFil.banco ? +finFil.banco : null;
  $('#fin_body').innerHTML = `
    <div class="kpis" id="cx_bancos"></div>
    <div class="card filtros">
      <label style="flex-direction:row;align-items:center;gap:8px">Mês <input type="month" value="${finFil.mes}" style="width:auto" onchange="finFil.mes=this.value||mesAtual();telaCaixa()"></label>
      <select style="flex:0 1 220px" onchange="finFil.banco=this.value;telaCaixa()"><option value="">Todas as contas</option>${bancos.map((b) => `<option value="${b.id}" ${bf === b.id ? 'selected' : ''}>${esc(b.nome)}${b.ativo ? '' : ' (inativa)'}</option>`).join('')}</select>
      <div class="actions" style="margin-left:auto"><button class="btn btn-ok" onclick="formCaixa('entrada')">+ Entrada</button><button class="btn btn-danger" onclick="formCaixa('saida')">− Saída</button><button class="btn" onclick="formTransf()">⇄ Transferir</button></div>

    const [todos, l0] = await Promise.all([
      fetchAll(() => sb.from('caixa').select('tipo,valor,banco_id,data')),
      fetchAll(() => sb.from('caixa').select('*').gte('data', ini).lte('data', fim).order('data').order('id')),
    ]);
    const saldoB = new Map(bancos.map((b) => [b.id, Number(b.saldo_inicial) || 0]));
    todos.forEach((x) => saldoB.set(x.banco_id, (saldoB.get(x.banco_id) || 0) + sinal(x)));
    const tot = [...saldoB.values()].reduce((s, v) => s + v, 0);
    $('#cx_bancos').innerHTML = bancos.filter((b) => b.ativo || Math.abs(saldoB.get(b.id) || 0) > 0.004).map((b) => {

      return `<div class="kpi" style="cursor:pointer;${bf === b.id ? 'border-color:var(--blue);background:var(--blue-l)' : ''}" onclick="finFil.banco='${bf === b.id ? '' : b.id}';telaCaixa()"><small>🏦 ${esc(b.nome)}</small><b style="color:${v < 0 ? 'var(--bad)' : ''}">${brl(v)}</b></div>`;
    }).join('') + `<div class="kpi admin" style="cursor:pointer" onclick="finFil.banco='';telaCaixa()"><small>Total em todas as contas</small><b style="color:${tot < 0 ? 'var(--bad)' : ''}">${brl(tot)}</b></div>`;
    const naConta = (x) => !bf || x.banco_id === bf;
    const inicial = bf ? Number(bancos.find((b) => b.id === bf)?.saldo_inicial || 0) : bancos.reduce((s, b) => s + Number(b.saldo_inicial || 0), 0);
    const sAnt = inicial + todos.filter((x) => x.data < ini && naConta(x)).reduce((s, x) => s + sinal(x), 0);
    const l = l0.filter(naConta);
    const conta = (x) => bf || x.categoria !== 'Transferência';
    const ent = l.filter((x) => x.tipo === 'entrada' && conta(x)).reduce((s, x) => s + Number(x.valor), 0);

    $('#cx_k').innerHTML = `

      <div class="kpi"><small>Saídas no mês</small><b style="color:var(--bad)">${brl(sai)}</b></div>
      <div class="kpi"><small>Resultado do mês</small><b style="color:${ent - sai < 0 ? 'var(--bad)' : 'var(--ok)'}">${brl(ent - sai)}</b></div>
      <div class="kpi admin"><small>Saldo no fim do mês${bf ? ' · ' + esc(nomeBanco(bf)) : ''}</small><b style="color:${sAnt + ent - sai < 0 ? 'var(--bad)' : ''}">${brl(sAnt + l.reduce((s, x) => s + sinal(x), 0))}</b></div>`;
    let saldo = sAnt;

    $('#cx_l').innerHTML = l.length ? `<table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Conta</th><th class="num">Valor</th><th class="num">Saldo</th><th></th></tr></thead><tbody>
      ${l.map((x) => `<tr>

        <td class="num" data-l="Saldo">${brl(x._saldo)}</td>
        <td class="num">${x.venda_id ? `<button class="btn btn-sm" onclick="verVenda(${x.venda_id})">Venda</button> ` : ''}${x.transf ? '' : `<button class="btn btn-sm" onclick="formCaixa('${x.tipo}',${x.id})">Editar</button> `}<button class="btn btn-sm btn-danger" onclick="excluirCaixa(${x.id})">Excluir</button></td></tr>`).join('')}
      </tbody></table>` : '<p class="muted">Nenhum lançamento neste mês.</p>';
  } catch (e) { erro(e); }

function formCaixa(tipo, id) {

      <label>Categoria<span id="cf_catw">${catSel('cf_cat', tipo, x?.categoria)}</span></label>
      <label>Forma<select id="cf_forma"><option></option>${formas.map((f) => `<option ${x?.forma === f ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
    </div>
    ${travado ? '<p class="hint">Este lançamento veio da baixa de uma conta. Para mudar o valor, use "Desfazer baixa" na conta e dê baixa de novo.</p>' : ''}

async function salvarCaixa(id) {
  const v = num($('#cf_val').value), d = $('#cf_desc').value.trim();
  if (!d) return toast('Informe a descrição', 'erro');
  if (!(v > 0)) return toast('Informe o valor', 'erro');
  if (!$('#cf_banco').value) return toast('Cadastre um banco/conta primeiro', 'erro');
  const body = { data: $('#cf_data').value || hojeISO(), descricao: d, categoria: $('#cf_cat').value || null, forma: $('#cf_forma').value || null, banco_id: +$('#cf_banco').value };
  if (!$('#cf_val').disabled) body.valor = r2(v);
  if (!$('#cf_tipo').disabled) body.tipo = $('#cf_tipo').value;
  $('#cf_go').disabled = true;
  const { error } = id ? await sb.from('caixa').update(body).eq('id', id) : await sb.from('caixa').insert({ ...body, usuario: me.nome });
  if (error) { $('#cf_go').disabled = false; return erro(error); }
  closeModal(); toast(id ? 'Lançamento alterado ✔' : 'Lançamento salvo ✔'); telaCaixa();
}
async function excluirCaixa(id) {

  if (!confirm(x?.transf ? 'Excluir esta transferência? Os dois lançamentos (saída e entrada) serão apagados.' : 'Excluir este lançamento do caixa?')) return;
  const { error } = x?.transf ? await sb.from('caixa').delete().eq('transf', x.transf) : await sb.from('caixa').delete().eq('id', id);
  if (error) return erro(error);

function formTransf() {

async function salvarTransf() {

function ncParcelas() {
  const v = num($('#nc_val').value), n = +$('#nc_n').value, div = $('#nc_modo').value === 'dividir', venc = $('#nc_venc').value;
  const base = div ? Math.floor(v / n * 100) / 100 : r2(v);
  return Array.from({ length: n }, (_, k) => {
    const d = inicioDia(venc || hojeISO()); const dia = d.getDate(); d.setMonth(d.getMonth() + k); if (d.getDate() !== dia) d.setDate(0);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    return { valor: div && k === n - 1 ? r2(v - base * (n - 1)) : base, vencimento: iso, parcela: n > 1 ? `${k + 1}/${n}` : null };
  });
}

function catsFinProd() { return [...new Set(produtos.map((p) => p.categoria).filter(Boolean))].sort((a, b) => a.localeCompare(b)); }
const isoMais1 = (iso) => { const d = inicioDia(iso); d.setDate(d.getDate() + 1); return d.toISOString(); };
function agrupa(lista, chave, campos) {
  const m = new Map();
  lista.forEach((x) => { const k = chave(x); const o = m.get(k) || Object.fromEntries(campos.map((c) => [c, 0])); campos.forEach((c) => o[c] += x[c] || 0); m.set(k, o); });
  return [...m.entries()];
}
async function gerarRel() {

async function relEstoque() {
  const { ini, fim } = relFil;
  const [ents, its, ajs] = await Promise.all([
    fetchAll(() => sb.from('entradas').select('produto_id,quantidade,custo_unit').gte('data', ini).lte('data', fim)),
    fetchAll(() => sb.from('venda_itens').select('produto_id,quantidade,vendas!inner(data,status,tipo)').eq('vendas.status', 'concluida').gte('vendas.data', inicioDia(ini).toISOString()).lt('vendas.data', isoMais1(fim))),
    fetchAll(() => sb.from('ajustes').select('produto_id,quantidade_anterior,quantidade_nova').gte('criado_em', inicioDia(ini).toISOString()).lt('criado_em', isoMais1(fim))),
  ]);
  let ps = produtos.filter((p) => p.ativo && (!relFil.categoria || p.categoria === relFil.categoria));
  if (relFil.situacao === 'baixo') ps = ps.filter((p) => p.estoque <= 0 || (p.estoque_minimo > 0 && p.estoque <= p.estoque_minimo));
  if (relFil.situacao === 'com') ps = ps.filter((p) => p.estoque > 0);
  const ids = new Set(ps.map((p) => p.id));
  const mov = new Map(ps.map((p) => [p.id, { ent: 0, vend: 0, sai: 0, aj: 0 }]));
  ents.forEach((e) => ids.has(e.produto_id) && (mov.get(e.produto_id).ent += e.quantidade));
  its.forEach((i) => ids.has(i.produto_id) && (mov.get(i.produto_id)[i.vendas.tipo === 'saida' ? 'sai' : 'vend'] += i.quantidade));
  ajs.forEach((a) => ids.has(a.produto_id) && (mov.get(a.produto_id).aj += a.quantidade_nova - a.quantidade_anterior));
  const cu = (p) => Number(p.c?.custo_final || 0);
  const tq = ps.reduce((s, p) => s + Math.max(0, p.estoque), 0), tc = ps.reduce((s, p) => s + Math.max(0, p.estoque) * cu(p), 0);
  const ta = ps.reduce((s, p) => s + Math.max(0, p.estoque) * Number(p.preco_atacado), 0), tv = ps.reduce((s, p) => s + Math.max(0, p.estoque) * Number(p.preco_varejo), 0);
  const parados = ps.filter((p) => p.estoque > 0 && !mov.get(p.id).vend);
  return {
    titulo: 'Relatório de estoque',
    resumo: [['Produtos', ps.length], ['Unidades em estoque', tq], ['Estoque a preço de custo', brl(tc)], ['Estoque a preço de atacado', brl(ta)], ['Estoque a preço de varejo', brl(tv)], ['Lucro potencial (varejo)', brl(tv - tc), 'var(--ok)'],
      ['Estoque baixo / zerado', ps.filter((p) => p.estoque <= 0 || (p.estoque_minimo > 0 && p.estoque <= p.estoque_minimo)).length, 'var(--warn)']],
    secoes: [
      { titulo: 'Posição atual do estoque', cab: ['Produto', 'Categoria', 'Qtd', 'Custo un.', 'Custo total', 'Atacado', 'Varejo', 'Varejo total'], num: [2, 3, 4, 5, 6, 7],
        linhas: ps.map((p) => [p.nome, p.categoria || '', p.estoque, brl(cu(p)), brl(Math.max(0, p.estoque) * cu(p)), brl(p.preco_atacado), brl(p.preco_varejo), brl(Math.max(0, p.estoque) * p.preco_varejo)]),
        total: ['TOTAL', '', tq, '', brl(tc), '', '', brl(tv)] },
      { titulo: 'Movimentação no período', cab: ['Produto', 'Entradas (compras)', 'Vendidos', 'Saídas sem venda', 'Ajustes', 'Estoque hoje'], num: [1, 2, 3, 4, 5],
        linhas: ps.filter((p) => { const m = mov.get(p.id); return m.ent || m.vend || m.sai || m.aj; }).map((p) => { const m = mov.get(p.id); return [p.nome, m.ent, m.vend, m.sai, (m.aj > 0 ? '+' : '') + m.aj, p.estoque]; }) },
      { titulo: 'Produtos parados (com estoque e sem venda no período)', cab: ['Produto', 'Qtd', 'Custo parado'], num: [1, 2],
        linhas: parados.sort((a, b) => b.estoque * cu(b) - a.estoque * cu(a)).map((p) => [p.nome, p.estoque, brl(p.estoque * cu(p))]),
        total: parados.length ? ['TOTAL', parados.reduce((s, p) => s + p.estoque, 0), brl(parados.reduce((s, p) => s + p.estoque * cu(p), 0))] : null },
    ],
  };
}

        <label>CNPJ<input id="cg_cnpj" value="${esc(cfg.cnpj || '')}"></label>
        <label>Telefone<input id="cg_fone" value="${esc(cfg.fone || '')}"></label>
        <label class="full">Endereço<input id="cg_end" value="${esc(cfg.endereco || '')}"></label>
        <label>Cidade (aparece na data)<input id="cg_cid" value="${esc(cfg.cidade || '')}"></label>
        <div><button class="btn btn-primary" onclick="salvarConfig()">Salvar</button></div>
      </div>
      <p class="hint">Os padrões são usados ao cadastrar produto novo. Cada produto pode ter margem própria. A margem mínima faz o sistema avisar quando um preço dá pouco lucro.</p>
    </div>
    <div class="card"><h3 style="margin-top:0">Usuários</h3>
      <p class="hint" style="margin-top:0">Funcionários criam a conta na tela de entrada ("Criar conta") e você libera aqui. <b>Funcionário</b> vende, cadastra clientes e consulta estoque e preços de venda — <b>não vê custo, imposto, margem nem lucro</b>.</p>
      <div id="cg_us"><p class="muted">Carregando…</p></div></div>
    <div class="card"><h3 style="margin-top:0">Cópia de segurança</h3>
      <div class="actions"><button class="btn" onclick="exportarProdutos()">Baixar produtos (planilha)</button><button class="btn" onclick="backupJSON()">Baixar backup completo</button></div></div>`;
  const { data, error } = await sb.from('perfis').select('*').order('criado_em');
  if (error) return erro(error);
  $('#cg_us').innerHTML = `<table class="tbl"><thead><tr><th>Nome</th><th>E-mail</th><th>Acesso</th></tr></thead><tbody>${data.map((u) => `
    <tr><td class="pn">${esc(u.nome)} ${u.papel === 'pendente' ? '<span class="tag warn">aguardando</span>' : ''}</td><td data-l="E-mail">${esc(u.email)}</td>
    <td data-l="Acesso">${u.id === me.id ? '<span class="tag blue">Administrador (você)</span>' : `<select onchange="mudarPapel('${u.id}',this.value)" style="width:auto">
      ${[['pendente', 'Aguardando liberação'], ['funcionario', 'Funcionário'], ['admin', 'Administrador'], ['bloqueado', 'Bloqueado']].map(([v, t]) => `<option value="${v}" ${u.papel === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`}</td></tr>`).join('')}</tbody></table>`;
}
async function salvarConfig() {
  const body = { razao: $('#cg_raz').value.trim(), cnpj: $('#cg_cnpj').value.trim(), fone: $('#cg_fone').value.trim(), endereco: $('#cg_end').value.trim(), cidade: $('#cg_cid').value.trim(), empresa: $('#cg_emp').value.trim() || 'Beto Informática', imposto_fora_pct: num($('#cg_imp').value), margem_minima_pct: num($('#cg_min').value), margem_atacado_pct: num($('#cg_ma').value), margem_varejo_pct: num($('#cg_mv').value) };
  const { data, error } = await sb.from('config').update(body).eq('id', 1).select().single();
  if (error) return erro(error);
  cfg = data; if (ent && !ent.itens.length) ent.imp = cfg.imposto_fora_pct; toast('Configurações salvas ✔');
}
async function mudarPapel(id, papel) {
  if (papel === 'admin' && !confirm('Administrador vê custos e lucros e pode mudar tudo. Confirmar?')) return telaConfig();
  const { error } = await sb.from('perfis').update({ papel }).eq('id', id);
  if (error) return erro(error);
  toast('Acesso atualizado ✔');
}
async function backupJSON() {
  try {
    const t = ['config', 'recibos', 'bancos', 'categorias', 'caixa', 'contas', 'produtos', 'produto_custos', 'notas', 'codigos_fornecedor', 'entradas', 'ajustes', 'clientes', 'precos_cliente', 'vendas', 'venda_itens', 'venda_custos'];
    const out = { gerado_em: new Date().toISOString() };
    for (const n of t) out[n] = await fetchAll(() => sb.from(n).select('*'));
    baixar(`backup-estoque-beto-${hojeISO()}.json`, JSON.stringify(out, null, 1), 'application/json');
  } catch (e) { erro(e); }
}

init();
</script>
</body>
</html>
